<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faith Interactive Kiosk</title>
  <style>
    :root {
      --primary: #4e73df;
      --secondary: #1cc88a;
      --accent: #36b9cc;
      --bg-gradient: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      --text: #343a40;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    h1 {
      color: var(--primary);
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 0.3rem;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
      user-select: none;
    }

    h2.subtitle {
      font-weight: 500;
      font-size: 1.4rem;
      margin-bottom: 2rem;
      color: var(--secondary);
      user-select: none;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 2rem 1rem;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .card h2 {
      margin: 1rem 0 0;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .card svg {
      width: 60px;
      height: 60px;
      fill: var(--primary);
      transition: fill 0.3s;
    }

    .card:hover svg {
      fill: var(--accent);
    }

    @media (max-width: 600px) {
      .card {
        padding: 1.5rem 1rem;
      }

      .card h2 {
        font-size: 1.3rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 0.1rem;
      }

      h2.subtitle {
        font-size: 1.2rem;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <h1>Faith Kiosk</h1>
  <h2 class="subtitle">Select what you want to do</h2>
  <div class="container">
    <div class="card" onclick="alert('Go to Video')">
      <svg viewBox="0 0 24 24">
        <path
          d="M10 8v8l5-4-5-4zm12-6H2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H2V4h20v16z" />
      </svg>
      <h2>Video</h2>
    </div>
    <div class="card" onclick="alert('Go to Quiz')">
      <svg viewBox="0 0 24 24">
        <path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z" />
      </svg>
      <h2>Quiz</h2>
    </div>
    <div class="card" onclick="alert('Go to Face Recognition')">
      <svg viewBox="0 0 24 24">
        <path
          d="M15 14c1.66 0 2.99-1.34 2.99-3S16.66 8 15 8s-3 1.34-3 3 1.34 3 3 3zM7.59 12.58C6.39 11.84 5.63 10.52 5.63 9c0-2.21 1.79-4 4-4 1.02 0 1.95.38 2.67 1H14V4h2v5h-5V7h1.38c-.24-.46-.53-.89-.9-1.26-1.52-1.52-4.02-1.52-5.54 0C4.67 7.92 4.67 11.08 7.59 12.58zM20 15v2h-2v-2h2zm-4 2v-2h2v2h-2zm2-4h2v2h-2v-2zM4 15v2H2v-2h2zm-2 4h2v2H2v-2zm2-8h2v2H4v-2zm14 8h2v2h-2v-2zm-8 0h2v2h-2v-2zm0-4h2v2h-2v-2z" />
      </svg>
      <h2>Face Recognition</h2>
    </div>
    <div class="card" onclick="alert('Go to Games')">
      <svg viewBox="0 0 24 24">
        <path
          d="M8 10h2V6H8v4zm6 8h2v-4h-2v4zM4 20h16V4H4v16zm0-18h16c1.1 0 2 .9 2 2v16a2 2 0 0 1-2 2H4c-1.1 0-2-.9-2-2V4a2 2 0 0 1 2-2z" />
      </svg>
      <h2>Games</h2>
    </div>
  </div>
</body>

</html>
